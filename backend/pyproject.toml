[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mes-backend"
version = "0.1.0"
description = "MES production execution system backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pyjwt>=2.8",
    "pwdlib[bcrypt]>=0.2",
    "pgvector>=0.3",
    "apscheduler>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
ai = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["app*"]
